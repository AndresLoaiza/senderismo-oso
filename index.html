<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07120d">
<title>Senderismoso</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%2307120d'/><circle cx='130' cy='55' r='16' fill='%23FBBF24'/><path d='M22 142 L70 73 L100 115 L122 84 L158 142 Z' fill='%2310B981'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous" defer></script>
<style>
  /* Fonts: Sora (display) · Manrope (UI/body) · JetBrains Mono (stats). Fallback to system if offline. */
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap');
  :root {
    /* Dark biophilic + glass — Senderismoso design system */
    --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
    --font-ui: 'Manrope', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;

    /* Field / surface ladder (near-black green → layered) */
    --bg: #07120d;
    --bg-2: #0c1f17;
    --bg-3: #122a20;
    --bg-4: #16352a;
    --border: #1f3d30;
    --border-soft: #163026;

    /* Text */
    --text: #ECFDF5;
    --text-dim: #7fa896;
    --text-faint: #4d6b5d;

    /* Emerald primary (replaces lilac) */
    --accent: #10B981;
    --accent-2: #34D399;
    --accent-200: #6EE7B7;
    --accent-deep: #065F46;

    /* Solar gold — CTA / price only */
    --yellow: #FBBF24;
    --gold-soft: #FDE68A;

    /* Semantic / level */
    --green: #34D399;
    --green-dark: #2f6b3a;
    --red: #F87171;
    --blue: #38BDF8;
    --orange: #FBBF24;

    /* Glass (floating chrome only: header, bottom bar, modal) */
    --glass-bg: rgba(16,185,129,0.10);
    --glass-border: rgba(52,211,153,0.22);
    --glass-blur: blur(14px) saturate(160%);
    --glass-shadow: 0 8px 40px rgba(0,0,0,0.45);

    /* Elevation + emerald glow */
    --shadow-2: 0 6px 20px rgba(0,0,0,0.45);
    --glow-emerald: 0 0 0 1px rgba(52,211,153,0.45), 0 0 24px rgba(16,185,129,0.28);

    /* Motion */
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --dur: 240ms;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body {
    max-width: 520px; margin: 0 auto; padding-bottom: 80px; min-height: 100vh;
    background:
      radial-gradient(120% 55% at 80% -6%, rgba(16,185,129,.16), transparent 55%),
      var(--bg);
  }
  h1, h2, h3, h4 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 700; letter-spacing: -0.015em; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; }
  h3 { font-size: 16px; color: var(--accent-2); }
  a { color: var(--accent-2); }
  button { font: inherit; font-family: var(--font-ui); cursor: pointer; }

  /* Header — glass */
  header {
    position: sticky; top: 0; z-index: 30; padding: 14px 16px 12px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-bottom: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
  }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .title-row h1 { color: var(--text); }
  .title-row .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; background: rgba(255,255,255,.03); color: var(--text-dim); border: 1px solid var(--border); padding: 9px 6px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .tabs button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* Filtros */
  .filters { padding: 14px 16px 6px; background: transparent; border-bottom: 1px solid var(--border-soft); }
  .filter-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .filter-row:last-child { margin-bottom: 4px; }
  .chip { background: var(--bg-2); color: var(--text-dim); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; transition: color var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
  .chip { display: inline-flex; align-items: center; gap: 5px; }
  .chip.active { background: rgba(16,185,129,.14); color: var(--accent-200); border-color: var(--accent); }
  .chip.risk.active { background: rgba(248,113,113,.12); color: #fecaca; border-color: var(--red); }
  .filter-label { font-size: 11px; color: var(--text-dim); width: 100%; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; margin-bottom: 2px; }
  input[type="range"] { width: 100%; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 999px; background: var(--bg-4); outline: none; accent-color: var(--accent); }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: var(--accent-2); border: 2px solid var(--bg); box-shadow: var(--glow-emerald); cursor: pointer; }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 999px; background: var(--bg-4); }
  input[type="range"]::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--accent); }
  input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent-2); border: 2px solid var(--bg); cursor: pointer; }
  input[type="text"], input[type="search"], select { width: 100%; background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 14px; padding: 11px 14px; font-size: 14px; font-family: var(--font-ui); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  input[type="search"]::placeholder { color: var(--text-faint); }
  input[type="search"]:focus, input[type="text"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,185,129,.16); }
  select { appearance: none; -webkit-appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  .price-row { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-dim); }
  .price-row input { flex: 1; }
  #priceMaxLabel { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--yellow); min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  .stat-bar { padding: 6px 16px 12px; background: transparent; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border-soft); display: flex; justify-content: space-between; align-items: center; }
  .stat-bar .reset { background: transparent; color: var(--accent-2); border: 1px solid var(--border); padding: 5px 11px; border-radius: 999px; font-size: 11px; font-weight: 600; }

  /* Cards — solid (no glass) for legibility */
  main { padding: 12px 16px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 15px 16px; margin-bottom: 12px; position: relative;
    box-shadow: var(--shadow-2);
    transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    animation: cardRise var(--dur) var(--ease) both;
  }
  .card:hover { box-shadow: var(--glow-emerald); border-color: transparent; }
  @keyframes cardRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card.estado-interesada { border-color: var(--accent); }
  .card.estado-planeada { border-color: var(--blue); }
  .card.estado-confirmada { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
  .card.estado-completada { border-color: var(--green-dark); opacity: 0.7; }
  .card.estado-descartada { opacity: 0.45; }
  .card.pfps-risk { border-left: 3px solid var(--red); }
  .card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .card .name { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.22; letter-spacing: -0.01em; }
  .card .subtitulo { font-size: 13px; color: var(--text-dim); margin-top: 3px; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 5px 10px; border-radius: 999px; background: var(--bg-3); color: var(--text-dim); font-weight: 600; border: 1px solid var(--border); }
  .badge.nivel-1 { color: var(--accent-200); }
  .badge.nivel-2 { color: var(--accent-200); }
  .badge.nivel-25 { color: var(--accent-2); }
  .badge.nivel-3 { color: var(--accent-2); }
  .badge.nivel-35 { color: var(--yellow); }
  .badge.nivel-4 { color: #fecaca; border-color: var(--red); background: rgba(248,113,113,.10); font-weight: 700; }
  .badge.nivel-5 { background: var(--red); color: var(--bg); border-color: var(--red); font-weight: 700; }
  .badge.compania { color: var(--accent-2); }
  .badge.price { color: var(--yellow); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .badge.days { color: var(--blue); }
  .badge.km { color: var(--accent-2); font-family: var(--font-mono); }
  .card .actions { display: flex; gap: 6px; margin-top: 13px; flex-wrap: wrap; }
  .card .actions button { background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); border-radius: 10px; padding: 8px 8px; font-size: 11px; font-weight: 600; flex: 1 1 auto; min-width: 92px; white-space: nowrap; transition: all var(--dur) var(--ease); }
  .card .actions button.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .card .actions button[data-estado="confirmada"].active { background: var(--green); border-color: var(--green); }
  .card .actions button[data-estado="planeada"].active { background: var(--blue); border-color: var(--blue); }
  .card .actions button[data-estado="descartada"].active { background: var(--red); border-color: var(--red); }
  .card .actions button[data-estado="completada"].active { background: var(--green-dark); border-color: var(--green-dark); color: var(--text); }
  .card .nota { font-size: 12px; color: var(--text-dim); margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--border-soft); font-style: italic; }
  .card .pfps-warning {
    font-size: 12px; color: #fca5a5; font-weight: 700; margin-top: 9px;
    padding: 9px 11px; border-radius: 10px;
    background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.32);
    animation: riskPulse 2.4s var(--ease) infinite;
  }
  @keyframes riskPulse {
    0%,100% { border-color: rgba(248,113,113,.35); box-shadow: 0 0 0 0 rgba(248,113,113,0); }
    50% { border-color: rgba(248,113,113,.9); box-shadow: 0 0 0 4px rgba(248,113,113,.08); }
  }
  .card .compare-toggle { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 10px; background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); font-size: 13px; padding: 0; line-height: 1; display: flex; align-items: center; justify-content: center; transition: all var(--dur) var(--ease); }
  .card .compare-toggle.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  /* Calendar */
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-head { font-size: 10px; color: var(--text-dim); text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
  .cal-cell { background: var(--bg-2); border: 1px solid var(--border-soft); border-radius: 10px; padding: 5px 6px; min-height: 56px; font-size: 11px; color: var(--text-dim); position: relative; cursor: pointer; transition: border-color var(--dur) var(--ease); }
  .cal-cell.has { color: var(--text); }
  .cal-cell.empty { background: transparent; border: none; cursor: default; }
  .cal-cell.weekend { background: var(--bg-2); }
  .cal-cell.festivo { background: rgba(251,191,36,.07); border-color: rgba(251,191,36,.3); }
  .cal-cell .day-num { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--text); }
  .cal-cell .day-num.dim { color: var(--text-faint); }
  .cal-cell .dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .cal-cell .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cal-cell .dot.lv-2 { background: var(--accent-200); }
  .cal-cell .dot.lv-25 { background: var(--accent); }
  .cal-cell .dot.lv-3 { background: var(--accent); }
  .cal-cell .dot.lv-35 { background: var(--yellow); }
  .cal-cell .dot.lv-4 { background: var(--red); }
  .cal-cell .dot.lv-5 { background: var(--red); border: 1px solid var(--text); }
  .cal-cell.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* Comparador */
  .compare-empty { text-align: center; padding: 40px 16px; color: var(--text-dim); }
  .compare-empty strong { color: var(--accent-2); }
  .compare-grid { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .compare-grid table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; }
  .compare-grid th, .compare-grid td { border-bottom: 1px solid var(--border-soft); padding: 10px 12px; text-align: left; vertical-align: top; }
  .compare-grid th { background: var(--bg-2); color: var(--text); font-family: var(--font-display); font-weight: 700; border-bottom: 1px solid var(--border); }
  .compare-grid td { background: var(--bg-2); color: var(--text); }
  .compare-grid .label-col { background: var(--bg-3); color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; width: 100px; }

  /* Empty / errors */
  .empty { text-align: center; padding: 48px 16px; color: var(--text-dim); }
  .loading { text-align: center; padding: 48px; color: var(--text-dim); }

  /* Bottom bar — glass */
  .bottom-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 520px;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border-top: 1px solid var(--glass-border); box-shadow: var(--glass-shadow);
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 40;
  }
  .bottom-bar .stats { font-size: 11px; color: var(--text-dim); line-height: 1.5; }
  .bottom-bar .stats strong { color: var(--accent-2); font-family: var(--font-mono); font-size: 14px; }
  .bottom-bar .stats #totalCop { color: var(--yellow); }
  .bottom-bar .export { background: var(--accent); color: var(--bg); border: 1px solid var(--accent); padding: 9px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; transition: all var(--dur) var(--ease); }
  .bottom-bar .export:hover { background: var(--accent-2); box-shadow: var(--glow-emerald); }

  /* Modal — glass slide-up */
  .modal-bg {
    position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(3,8,6,0); visibility: hidden; pointer-events: none;
    transition: background var(--dur) var(--ease), visibility 0s linear var(--dur);
  }
  .modal-bg.open { background: rgba(3,8,6,.62); visibility: visible; pointer-events: auto; transition: background var(--dur) var(--ease); }
  .modal {
    width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto;
    border-radius: 16px 16px 0 0;
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border); border-bottom: none; box-shadow: var(--glass-shadow);
    padding: 18px 18px 22px;
    transform: translateY(100%); transition: transform var(--dur) var(--ease);
  }
  .modal-bg.open .modal { transform: none; }
  .modal h2 { color: var(--text); font-family: var(--font-display); }
  .modal .close { background: var(--bg-3); color: var(--text); border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px; font-size: 13px; width: 100%; margin-top: 14px; font-weight: 700; }
  .modal ul { padding-left: 20px; }
  .modal li { margin-bottom: 4px; font-size: 13px; }

  /* Lucide inline icons */
  .ico { flex: none; vertical-align: -0.18em; }
  .ico-brand { color: var(--accent); vertical-align: -0.22em; }
  .card .actions button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .pfps-warning { display: flex; align-items: flex-start; gap: 7px; }
  .pfps-warning .ico { color: var(--red); margin-top: 1px; }

  /* Search input with leading icon */
  .search-wrap { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 0 14px; transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
  .search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(16,185,129,.16); }
  .search-wrap .ico { color: var(--text-dim); vertical-align: middle; }
  .search-wrap input[type="search"] { border: none; background: none; border-radius: 0; padding: 11px 0; }
  .search-wrap input[type="search"]:focus { box-shadow: none; border: none; }

  /* Weather */
  .wx-spin { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; vertical-align: -2px; animation: wx-rot .7s linear infinite; }
  @keyframes wx-rot { to { transform: rotate(360deg); } }
  .wx-card { background: var(--bg-3); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 6px; }
  .wx-title { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); font-weight: 700; margin-bottom: 6px; }
  .wx-head { font-size: 15px; margin-bottom: 6px; color: var(--text); }
  .wx-line { font-size: 13px; color: var(--text); margin: 2px 0; }
  .wx-note { font-size: 11px; color: var(--text-dim); margin-top: 7px; }

  /* Sync gear (header) */
  .sync-gear { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text-dim); display: grid; place-items: center; cursor: pointer; }
  .sync-gear.connected { color: var(--accent); border-color: var(--accent); }

  /* Track / caminata (bitácora) */
  .trk-stats { display: flex; flex-wrap: wrap; gap: 6px 12px; font-family: var(--font-mono); font-size: 13px; color: var(--text); margin-bottom: 8px; }
  .trk-stats b { color: var(--accent); font-weight: 700; }
  .trk-stats .up { color: var(--accent); }
  .trk-stats .down { color: var(--text-dim); }
  .trk-profile { width: 100%; height: 72px; display: block; margin: 4px 0 8px; }
  .trk-map { width: 100%; height: 220px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--bg-2); }
  .trk-map .leaflet-tile-pane { filter: saturate(.85); }
  .trk-actions { display: flex; gap: 8px; margin-top: 10px; }
  .trk-actions button { flex: 1; background: var(--bg-4); color: var(--text); border: 1px solid var(--border); padding: 9px; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .trk-import { background: var(--accent) !important; color: var(--bg) !important; border-color: var(--accent) !important; }
  .badge.track { color: var(--accent); border-color: var(--accent); font-family: var(--font-mono); }

  /* Sync modal fields */
  .sync-field { width: 100%; background: var(--bg-2); color: var(--text); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font-size: 13px; margin: 6px 0; font-family: var(--font-mono); }
  .sync-btn { width: 100%; background: var(--accent); color: var(--bg); border: none; padding: 11px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 4px; }
  .sync-btn.ghost { background: var(--bg-3); color: var(--text-dim); border: 1px solid var(--border); }
  .sync-status { font-size: 13px; margin: 8px 0; padding: 9px 12px; border-radius: 9px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text-dim); }
  .sync-status.ok { color: var(--accent); border-color: var(--accent); }
  .sync-status.err { color: #fecaca; border-color: var(--red); }
  .sync-help { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-top: 10px; }

function rangosLluvia(times, precs) {
  if (!times || !precs) return { texto: "", franjas: [] };
  const rainy = [];
  for (let i = 0; i < times.length; i++) {
    if (precs[i] != null && precs[i] >= 0.2) rainy.push(+times[i].slice(11, 13));
  }
  if (!rainy.length) return { texto: "", franjas: [] };
  // rangos contiguos
  const rangos = [];
  let ini = rainy[0], prev = rainy[0];
  for (let i = 1; i < rainy.length; i++) {
    if (rainy[i] === prev + 1) { prev = rainy[i]; }
    else { rangos.push([ini, prev]); ini = prev = rainy[i]; }
  }
  rangos.push([ini, prev]);
  const texto = rangos.map(([a, b]) => a === b ? `${a}h` : `${a}–${b + 1}h`).join(", ");
  const franjas = [...new Set(rainy.map(franjaNombre))];

function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const la1 = a.lat * rad, la2 = b.lat * rad;
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function parseGPX(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("GPX inválido");
  let nodes = [...doc.querySelectorAll("trkpt")];
  if (!nodes.length) nodes = [...doc.querySelectorAll("rtept")]; // fallback ruta
  const points = nodes.map(n => {
    const lat = parseFloat(n.getAttribute("lat"));
    const lng = parseFloat(n.getAttribute("lon"));
    const eleN = n.querySelector("ele"), timeN = n.querySelector("time");
    return {
      lat, lng,
      ele: eleN ? parseFloat(eleN.textContent) : null,
      time: timeN ? Date.parse(timeN.textContent) : null
    };
  }).filter(p => Number.isFinite(p.lat) && Number.isFinite(p.lng));
  if (!points.length) throw new Error("Archivo sin recorrido (sin puntos)");
  return points;
}

  // Subida/bajada con umbral de ruido
  let ascent = null, descent = null, maxAlt = null, minAlt = null;
  if (hasEle) {
    ascent = 0; descent = 0;
    let anchor = null;
    for (const p of points) {
      if (!Number.isFinite(p.ele)) continue;
      if (maxAlt == null || p.ele > maxAlt) maxAlt = p.ele;
      if (minAlt == null || p.ele < minAlt) minAlt = p.ele;
      if (anchor == null) { anchor = p.ele; continue; }
      const d = p.ele - anchor;
      if (Math.abs(d) >= MIN_ELE_DELTA) {
        if (d > 0) ascent += d; else descent += -d;
        anchor = p.ele;
      }
    }
  }
  // Duración
  let durMin = null;
  if (hasTime) {
    const ts = points.map(p => p.time).filter(Number.isFinite);
    if (ts.length >= 2) durMin = Math.round((Math.max(...ts) - Math.min(...ts)) / 60000);
  }
  // Polilínea mapa + bounds
  const sampled = sampleEvenly(points, PATH_PTS);
  const path = sampled.map(p => [p.lat, p.lng]);
  const lats = path.map(p => p[0]), lngs = path.map(p => p[1]);
  const bounds = [[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]];
  return {
    km: +(distM/1000).toFixed(2),
    ascentM: ascent == null ? null : Math.round(ascent),
    descentM: descent == null ? null : Math.round(descent),
    durMin,
    maxAlt: maxAlt == null ? null : Math.round(maxAlt),
    minAlt: minAlt == null ? null : Math.round(minAlt),
    importedAt: new Date().toISOString(),
    fileName: fileName || "ruta.gpx",
    profile: sampleEvenly(profileRaw, PROFILE_PTS),
    path, bounds
  };
}
function importGPXForRoute(id, file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const track = computeTrack(parseGPX(reader.result), file.name);
      if (!STATE.rutas[id]) STATE.rutas[id] = {};
      STATE.rutas[id].track = track;
      saveState();
      const r = DATA.rutas.find(x => x.id === id);
      if (r) openModal(r); // re-render modal con la tarjeta
      renderCurrent();
    } catch (e) {
      alert("No se pudo importar el GPX: " + e.message);
    }
  };
  reader.onerror = () => alert("No se pudo leer el archivo.");
  reader.readAsText(file);
}
function fmtDur(min) {
  if (min == null) return "n/d";
  const h = Math.floor(min/60), m = min % 60;
  return h ? `${h}h${String(m).padStart(2,"0")}` : `${m}min`;
}
function elevationSVG(profile) {
  if (!profile || profile.length < 2) return "";
  const W = 300, H = 72, pad = 4;
  const xs = profile.map(p => p[0]), ys = profile.map(p => p[1]);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  const sx = x => pad + (xMax === xMin ? 0 : (x - xMin)/(xMax - xMin)) * (W - 2*pad);
  const sy = y => (H - pad) - (yMax === yMin ? 0 : (y - yMin)/(yMax - yMin)) * (H - 2*pad);
  const pts = profile.map(p => `${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`);
  const line = "M" + pts.join(" L");
  const area = `${line} L${sx(xMax).toFixed(1)},${H-pad} L${sx(xMin).toFixed(1)},${H-pad} Z`;
  return `<svg class="trk-profile" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Perfil de elevación">
    <path d="${area}" fill="var(--accent)" fill-opacity="0.16"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
  </svg>`;
}
function trackCardHTML(t) {
  const stats = [];
  stats.push(`<span>↔ <b>${t.km}</b> km</span>`);
  stats.push(`<span class="up">↑ ${t.ascentM == null ? "n/d" : t.ascentM + " m"}</span>`);
  stats.push(`<span class="down">↓ ${t.descentM == null ? "n/d" : t.descentM + " m"}</span>`);
  stats.push(`<span>⏱ ${fmtDur(t.durMin)}</span>`);

  return `<div class="wx-card">

    <div class="trk-actions">

    <div class="wx-note">Importado de ${escapeHtml(t.fileName)} · subida/bajada con umbral ${MIN_ELE_DELTA} m</div>
  </div>`;
}

function nivelClass(n) {
  if (n === 2.5) return "nivel-25";
  if (n === 3.5) return "nivel-35";
  return "nivel-" + Math.floor(n);
}

function nivelLabel(n) { return DATA._meta?.escala_nivel?.[String(n)] || ("Nivel " + n); }

function applyFilters(rutas) {
  return rutas.filter(r => {
    if (FILTERS.compania !== "all" && r.compania !== FILTERS.compania) return false;
    if (FILTERS.nivel.length && !FILTERS.nivel.includes(r.nivel)) return false;
    if (FILTERS.dias === "1" && r.dias !== 1) return false;
    if (FILTERS.dias === "multi" && r.dias <= 1) return false;
    if (FILTERS.dow.length) {
      const start = new Date(r.fecha_inicio + "T12:00:00");
      const end = new Date(r.fecha_fin + "T12:00:00");
      let match = false;
      for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
        if (FILTERS.dow.includes(d.getDay())) { match = true; break; }
      }
      if (!match) return false;
    }
    if (FILTERS.precioMax && r.precio_cop > FILTERS.precioMax) return false;
    if (FILTERS.estado === "marcadas" && !["interesada","planeada","confirmada","completada"].includes(getEstado(r.id))) return false;
    if (FILTERS.estado === "sin-descartar" && getEstado(r.id) === "descartada") return false;
    if (FILTERS.search) {
      const q = FILTERS.search.toLowerCase();
      const hay = [r.nombre, r.subtitulo, r.ubicacion, r.punto_encuentro, (r.incluye||[]).join(" "), r.notas].filter(Boolean).join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function sortByFecha(rutas) {
  return [...rutas].sort((a,b) => (a.fecha_inicio||"").localeCompare(b.fecha_inicio||"") || a.nombre.localeCompare(b.nombre));
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

function renderCatalogo() {
  const rutas = sortByFecha(applyFilters(DATA.rutas));
  const $c = document.getElementById("content");
  if (!rutas.length) { $c.innerHTML = `<div class="empty">Sin rutas con esos filtros.</div>`; return; }
  $c.innerHTML = rutas.map(cardHTML).join("");
  document.getElementById("statText").textContent = `${rutas.length} ruta${rutas.length===1?"":"s"} · de ${DATA.rutas.length} en catálogo`;
}

function renderCalendario() {
  const rutas = applyFilters(DATA.rutas);
  const byDay = {};
  rutas.forEach(r => {
    const start = new Date(r.fecha_inicio + "T12:00:00");
    const end = new Date(r.fecha_fin + "T12:00:00");
    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      const key = d.toISOString().slice(0,10);
      (byDay[key] = byDay[key] || []).push(r);
    }
  });

  const year = 2026, month = 5; // jun
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  const startDow = (firstDay.getDay() + 6) % 7; // lun=0
  const totalDays = lastDay.getDate();

  const head = ["L","M","X","J","V","S","D"];
  let html = `<div class="calendar">`;
  head.forEach(h => html += `<div class="cal-head">${h}</div>`);
  for (let i = 0; i < startDow; i++) html += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= totalDays; day++) {
    const date = `2026-06-${String(day).padStart(2,"0")}`;
    const rutas = byDay[date] || [];
    const dow = new Date(year, month, day).getDay();
    const isWeekend = dow === 0 || dow === 6;
    const isFestivo = FESTIVOS_JUN_2026.includes(date);
    const cls = ["cal-cell"];
    if (rutas.length) cls.push("has");
    if (isWeekend) cls.push("weekend");
    if (isFestivo) cls.push("festivo");
    if (CAL_SELECTED_DAY === date) cls.push("selected");
    const dots = rutas.slice(0,12).map(r => `<span class="dot ${nivelClass(r.nivel)}"></span>`).join("");
    html += `<div class="${cls.join(" ")}" data-date="${date}">
      <div class="day-num">${day}</div>
      <div class="dots">${dots}</div>
    </div>`;
  }
  html += `</div>`;

  if (CAL_SELECTED_DAY) {
    const rutas = sortByFecha(byDay[CAL_SELECTED_DAY] || []);
    const titulo = FMT_FECHA(CAL_SELECTED_DAY);
    html += `<h3 style="margin: 18px 0 10px">${titulo} · ${rutas.length} ruta${rutas.length===1?"":"s"}</h3>`;
    html += rutas.map(cardHTML).join("") || `<div class="empty">Sin rutas este día.</div>`;
  } else {
    html += `<div class="empty" style="padding: 20px">Toca un día para ver rutas. Puntos = rutas; color = nivel.</div>`;
  }

  document.getElementById("content").innerHTML = html;
  document.getElementById("statText").textContent = `Junio 2026 · ${rutas.length} rutas filtradas`;
}

    if (!est || est === "descartada") return;

let trackMap = null;
function wireTrackSection(r) {
  const id = r.id;
  const input = document.getElementById("gpxInput");
  const row = document.getElementById("trackRow");
  if (input) input.onchange = () => { if (input.files[0]) importGPXForRoute(id, input.files[0]); };
  if (row) row.onclick = e => {
    const b = e.target.closest("button[data-trk]"); if (!b) return;
    const act = b.dataset.trk;
    if (act === "import" || act === "replace") input.click();
    else if (act === "remove") {
      if (!confirm("¿Quitar la caminata importada de esta ruta?")) return;
      if (STATE.rutas[id]) { delete STATE.rutas[id].track; saveState(); }
      openModal(r); renderCurrent();
    }
  };
  initTrackMap(getTrack(id));
}
function initTrackMap(t) {
  if (trackMap) { trackMap.remove(); trackMap = null; }
  if (!t || !t.path || !t.path.length) return;
  const el = document.getElementById("trackMap");
  if (!el) return;
  if (typeof L === "undefined") {
    el.innerHTML = `<div class="wx-note" style="padding:10px">Mapa no disponible (sin conexión la primera vez).</div>`;
    return;
  }
  // Espera a que el modal sea visible para medir el contenedor
  requestAnimationFrame(() => {
    trackMap = L.map(el, { attributionControl: false, zoomControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(trackMap);
    L.polyline(t.path, { color: "#10B981", weight: 4, opacity: 0.9 }).addTo(trackMap);
    L.circleMarker(t.path[0], { radius: 5, color: "#FBBF24", fillColor: "#FBBF24", fillOpacity: 1 }).addTo(trackMap);
    L.circleMarker(t.path[t.path.length-1], { radius: 5, color: "#10B981", fillColor: "#10B981", fillOpacity: 1 }).addTo(trackMap);
    trackMap.fitBounds(t.bounds, { padding: [16, 16] });
    setTimeout(() => trackMap && trackMap.invalidateSize(), 60);
  });
}

// Clima en modal: solo si fecha dentro próximos 16 días, no pasada, y hay coords. Degrada en silencio.
async function loadWeather(r) {
  const row = document.getElementById("weatherRow");
  if (!row) return;
  const coords = resolveCoords(r.ubicacion);
  if (!coords) return;
  const fecha = r.fecha_inicio;
  if (!fecha) return;
  // Días hasta la ruta (medianoche local)
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dia = new Date(fecha + "T12:00:00"); dia.setHours(0, 0, 0, 0);
  const diffDias = Math.round((dia - hoy) / 86400000);
  if (diffDias < 0 || diffDias > 16) return; // ya pasó o fuera de rango forecast
  row.innerHTML = `<p style="color: var(--text-dim)"><span class="wx-spin"></span> Cargando clima…</p>`;
  try {
    const data = await getWeather(coords[0], coords[1], fecha);
    const d = data?.daily;
    const tmax = d?.temperature_2m_max?.[0];
    if (tmax == null) { row.innerHTML = ""; return; }
    const tmin = d?.temperature_2m_min?.[0];
    const code = d?.weather_code?.[0];
    const mm = d?.precipitation_sum?.[0];
    const prob = d?.precipitation_probability_max?.[0];
    const wind = d?.wind_speed_10m_max?.[0];
    const [desc, emo] = wmoDesc(code);
    const { texto: horasTxt, franjas } = rangosLluvia(data?.hourly?.time, data?.hourly?.precipitation);

    // Veredicto: ¿sol o lluvia? (combina prob, mm y código)
    const llueve = (prob != null && prob >= 50) || (mm != null && mm >= 1) || (code >= 51 && code <= 99);
    const verdict = llueve ? "Probablemente llueva" : (code >= 1 && code <= 3 ? "Mayormente seco, algo nublado" : "Día seco");

    // Líneas
    const lineas = [];
    lineas.push(`<div class="wx-head">${emo} <strong>${escapeHtml(desc)}</strong> — ${verdict}</div>`);
    lineas.push(`<div class="wx-line">🌡 ${Math.round(tmax)}° máx${tmin != null ? ` · ${Math.round(tmin)}° mín` : ""}</div>`);
    if (llueve || horasTxt) {
      let r2 = `🌧 ${prob != null ? prob + "% prob · " : ""}~${mm != null ? Math.round(mm) : 0}mm`;
      if (horasTxt) r2 += ` · sobre todo ${franjas.join("/")} (${horasTxt})`;
      lineas.push(`<div class="wx-line">${r2}</div>`);
    } else {
      lineas.push(`<div class="wx-line">🌤 Sin lluvia esperada</div>`);
    }
    if (wind != null) lineas.push(`<div class="wx-line">💨 Viento hasta ${Math.round(wind)} km/h</div>`);

    row.innerHTML = `<div class="wx-card"><div class="wx-title">Clima previsto</div>${lineas.join("")}` +
      `<div class="wx-note">Pronóstico Open-Meteo · puede cambiar</div></div>`;
  } catch (e) {
    row.innerHTML = ""; // fetch falló → no romper modal
  }
}
function closeModal() {
  document.getElementById("modalBg").classList.remove("open");
  if (trackMap) { trackMap.remove(); trackMap = null; }
}

function exportData() {
  const marcadas = DATA.rutas
    .filter(r => {
      const e = getEstado(r.id);
      return e && e !== "descartada";
    })
    .sort((a,b) => a.fecha_inicio.localeCompare(b.fecha_inicio));
  let txt = "🥾 ITINERARIO SENDERISMO — " + new Date().toLocaleDateString("es-CO") + "\n\n";
  if (!marcadas.length) txt += "(Sin rutas marcadas)\n";
  marcadas.forEach(r => {
    const est = getEstado(r.id);
    const fechaTxt = r.fecha_inicio === r.fecha_fin ? r.fecha_inicio : `${r.fecha_inicio} → ${r.fecha_fin}`;
    txt += `[${est.toUpperCase()}] ${fechaTxt} · ${r.nombre}${r.subtitulo?` (${r.subtitulo})`:""}\n`;
    txt += `  Nivel ${r.nivel} · ${(r.precio_desde?"desde ":"")}${FMT_COP(r.precio_cop)} · ${DATA.companias[r.compania]?.nombre||r.compania}\n`;
    if (r.nivel >= PFPS_RISK_MIN) txt += `  ⚠ PFPS riesgo alto\n`;
    txt += "\n";
  });
  const total = marcadas.reduce((s,r) => s + (r.precio_cop||0), 0);
  txt += `\nTOTAL ESTIMADO: ${FMT_COP(total)}\n`;
  if (navigator.share) {
    navigator.share({ text: txt, title: "Itinerario Senderismo" }).catch(() => fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  navigator.clipboard?.writeText(txt).then(
    () => alert("Itinerario copiado al portapapeles ✓"),
    () => prompt("Copia manual:", txt)
  );
}

/* ---------- Sync modal (ajustes) ---------- */
function updateGearState() {
  const g = document.getElementById("syncGear");
  if (g) g.classList.toggle("connected", !!getPat());
}
function openSync() {
  const connected = !!getPat();
  const syncedAt = localStorage.getItem("gist_synced_at");
  const status = connected
    ? `<div class="sync-status ok">${ICON("check",13)} Conectado${syncedAt ? " · último sync " + new Date(syncedAt).toLocaleString("es-CO",{hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"}) : ""}</div>`
    : `<div class="sync-status">Sin conectar — los datos viven solo en este dispositivo.</div>`;
  const html = `
    <h2>${ICON("settings",18)} Sync / Backup</h2>
    <p style="color:var(--text-dim);font-size:13px;margin-top:0">Respaldo en la nube y sincronización entre dispositivos vía GitHub Gist privado.</p>
    ${status}
    <input type="password" class="sync-field" id="patInput" placeholder="${connected ? "•••••••• (token guardado)" : "Pega tu token de GitHub aquí"}" autocomplete="off">
    <button class="sync-btn" id="syncConnect">${connected ? "Actualizar token y sincronizar" : "Conectar y sincronizar"}</button>
    ${connected ? `<button class="sync-btn ghost" id="syncDisconnect">Desconectar (borra token de este equipo)</button>` : ""}
    <div class="sync-help">
      <strong>Crear token (1 sola vez):</strong><br>
      GitHub → Settings → Developer settings → <em>Fine-grained tokens</em> → Generate.<br>
      Permiso: solo <strong>Gists</strong> (Read and write). Nada más.<br>
      Pégalo arriba. Se guarda solo en este dispositivo, nunca en el código.<br>
      <a href="https://github.com/settings/tokens?type=beta" target="_blank" rel="noopener">Abrir GitHub tokens →</a>
    </div>
    <button class="close" id="closeSync">Cerrar</button>
  `;
  document.getElementById("syncModal").innerHTML = html;
  document.getElementById("syncBg").classList.add("open");
  document.getElementById("closeSync").onclick = closeSync;
  document.getElementById("syncConnect").onclick = async () => {
    const v = document.getElementById("patInput").value.trim();
    if (v) localStorage.setItem(PAT_KEY, v);
    if (!getPat()) { alert("Pega un token primero."); return; }
    const btn = document.getElementById("syncConnect");
    btn.textContent = "Sincronizando…"; btn.disabled = true;
    try {
      await syncPull();   // trae remoto si es más nuevo
      await pushNow();    // sube local (crea gist si no existe)
      updateGearState();
      openSync();
    } catch (e) {
      document.getElementById("syncModal").querySelector(".sync-status")?.remove();
      const err = document.createElement("div");
      err.className = "sync-status err";
      err.textContent = "Error: " + e.message + " (¿token válido con permiso Gists?)";
      document.getElementById("patInput").before(err);
      btn.textContent = "Reintentar"; btn.disabled = false;
    }
  };
  const dis = document.getElementById("syncDisconnect");
  if (dis) dis.onclick = () => {
    if (!confirm("¿Desconectar? Se borra el token de este dispositivo (tus datos locales se conservan).")) return;
    localStorage.removeItem(PAT_KEY);
    updateGearState();
    openSync();
  };
}
function closeSync() { document.getElementById("syncBg").classList.remove("open"); }

function attachEvents() {
  document.getElementById("tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-view]"); if (!b) return;
    VIEW = b.dataset.view;
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
    renderCurrent();
  });
  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("button.chip"); if (!b) return;
    const f = b.dataset.filter, v = b.dataset.value;
    if (f === "nivel" || f === "dow") {
      if (v === "all") {
        FILTERS[f] = [];
      } else {
        const num = parseInt(v, 10);
        const parsed = f === "nivel" ? parseFloat(v) : num;
        const i = FILTERS[f].indexOf(parsed);
        if (i >= 0) FILTERS[f].splice(i, 1);
        else FILTERS[f].push(parsed);
      }
      const all = FILTERS[f].length === 0;
      document.querySelectorAll(`#filters button[data-filter="${f}"]`).forEach(x => {
        const xv = x.dataset.value;
        if (xv === "all") x.classList.toggle("active", all);
        else {
          const parsed = f === "nivel" ? parseFloat(xv) : parseInt(xv, 10);
          x.classList.toggle("active", FILTERS[f].includes(parsed));
        }
      });
    } else {
      FILTERS[f] = v;
      document.querySelectorAll(`#filters button[data-filter="${f}"]`).forEach(x => x.classList.toggle("active", x === b));
    }
    renderCurrent();
  });
  const priceMax = document.getElementById("priceMax");
  priceMax.addEventListener("input", () => {
    FILTERS.precioMax = +priceMax.value;
    document.getElementById("priceMaxLabel").textContent = FMT_COP(FILTERS.precioMax);
  });
  priceMax.addEventListener("change", renderCurrent);
  document.getElementById("search").addEventListener("input", e => {
    FILTERS.search = e.target.value.trim();
    renderCurrent();
  });
  document.getElementById("resetFilters").addEventListener("click", () => {
    FILTERS = { compania: "all", nivel: [], dias: "all", dow: [], estado: "all", precioMax: 2600000, search: "" };
    document.querySelectorAll("#filters .chip").forEach(c => c.classList.toggle("active", c.dataset.value === "all"));
    document.getElementById("priceMax").value = 2600000;
    document.getElementById("priceMaxLabel").textContent = "$2.600.000";
    document.getElementById("search").value = "";
    renderCurrent();
  });
  document.getElementById("content").addEventListener("click", e => {
    const cell = e.target.closest(".cal-cell[data-date]");
    if (cell && VIEW === "calendario") {
      CAL_SELECTED_DAY = CAL_SELECTED_DAY === cell.dataset.date ? null : cell.dataset.date;
      renderCalendario();
      return;
    }
    const card = e.target.closest(".card[data-id]");
    if (!card) return;
    const id = card.dataset.id;
    const r = DATA.rutas.find(x => x.id === id);
    if (!r) return;
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    if (btn.dataset.act === "estado") setEstado(id, btn.dataset.estado);
    else if (btn.dataset.act === "compare") toggleCompare(id);
    else if (btn.dataset.act === "detalle") openModal(r);
  });
  document.getElementById("modalBg").addEventListener("click", e => {
    if (e.target.id === "modalBg") closeModal();
  });
  document.getElementById("syncBg").addEventListener("click", e => {
    if (e.target.id === "syncBg") closeSync();
  });
  document.getElementById("syncGear").addEventListener("click", openSync);
  document.getElementById("exportBtn").addEventListener("click", exportData);
}

async function init() {
  attachEvents();
  try {
    const res = await fetch("./data/rutas.json?v=" + Date.now());
    DATA = await res.json();
  } catch (e) {
    document.getElementById("content").innerHTML = `<div class="empty">Error cargando rutas.json. Sirve este archivo desde un servidor (no <code>file://</code>).</div>`;
    console.error(e);
    return;
  }
  document.getElementById("syncGear").innerHTML = ICON("settings", 20);
  renderCurrent();
  renderBottomBar();
  updateGearState();
  // Sync inicial: trae estado remoto si es más nuevo. Silencioso si falla/offline.
  syncPull().catch(() => {});
  window.addEventListener("online", () => { pushNow().catch(() => {}); });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
}

init();
</script>
